name: CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "common/**"
      - ".github/workflows/**"
  push:
    paths:
      - "backend/**"
      - "common/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  ci:
    name: Validate monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            common/package-lock.json
            backend/package-lock.json

      - name: Install common dependencies
        run: npm ci --ignore-scripts
        working-directory: common

      - name: Typecheck common package
        run: npm run typecheck
        working-directory: common

      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Generate Prisma client for backend checks
        run: npm run generate:ci
        working-directory: backend

      - name: Typecheck backend package
        run: npm run typecheck
        working-directory: backend

  deploy:
    name: Deploy backend to Cloudflare
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate Cloudflare token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is required."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install backend dependencies
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Validate Cloudflare token with Wrangler
        run: |
          echo "== Validating CLOUDFLARE_API_TOKEN with 'wrangler whoami' =="
          npx -y wrangler whoami || (
            echo "\nERROR: Cloudflare authentication failed. Common causes:\n  - token lacks required scopes (workers_scripts:write, account:read, etc.)\n  - token is IP-restricted and cannot be used from GitHub Actions runner\n\nPlease recreate a token without IP restrictions and update the CLOUDFLARE_API_TOKEN secret.\n" && exit 1
          )
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Generate Prisma client
        run: npm run generate:ci
        working-directory: backend

      - name: Deploy backend worker
        run: npm run deploy
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
